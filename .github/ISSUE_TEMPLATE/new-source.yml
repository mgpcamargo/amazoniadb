name: New source submission
description: Propose a dataset, repository, or portal for the AmazoniaDB directory.
title: "[source] "
labels: ["new-source"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a source. Please read CONTRIBUTING.md first — link only to the original publisher, don't submit sensitive locations or restricted knowledge, and default to Brazil unless a source is genuinely pan-Amazon or global.

        Submitting this form opens a GitHub Action that validates your entry and opens a draft pull request automatically. A maintainer still reviews it before it's merged.
  - type: input
    id: url
    attributes:
      label: Original publisher URL
      description: Link to the publisher's dataset, repository, or official portal — not a mirror. Must start with https://
      placeholder: "https://publisher.org/dataset"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Source title
      placeholder: Dataset or portal name
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Original provider
      placeholder: Institution or publisher
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Domain
      options:
        - "Forests & biodiversity"
        - "Earth, water & air"
        - "Land, fire & change"
        - "Peoples & territories"
        - "Health & livelihoods"
        - "Rights & governance"
    validations:
      required: true
  - type: dropdown
    id: coverage
    attributes:
      label: Coverage
      options:
        - "Brazil"
        - "Pan-Amazon"
        - "Peru"
        - "Colombia"
        - "Bolivia"
        - "Ecuador"
        - "Global — subsettable"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Source type
      options:
        - "Dataset"
        - "Data portal"
        - "Download"
        - "Explorer"
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Access note
      description: Default to "Provider terms apply" unless the provider explicitly states open/free access, or names a specific license.
      options:
        - "Provider terms apply"
        - "Dataset-specific license"
        - "Publicly available"
    validations:
      required: true
  - type: input
    id: formats
    attributes:
      label: Data forms
      description: Comma-separated, e.g. GeoTIFF, CSV, API
      placeholder: "GeoTIFF, CSV, API"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Plain-language description
      description: What the source contains and how it's structured — not what you infer from it.
    validations:
      required: true
  - type: textarea
    id: description_pt_br
    attributes:
      label: Descrição em português (Brasil)
      description: Traduza a descrição acima para português do Brasil. Mantenha os nomes próprios e termos técnicos do provedor quando necessário.
    validations:
      required: true
  - type: textarea
    id: description_es
    attributes:
      label: Descripción en español
      description: Traduce la descripción anterior al español. Conserva los nombres propios y los términos técnicos del proveedor cuando sea necesario.
    validations:
      required: true
  - type: input
    id: temporal_coverage
    attributes:
      label: Temporal coverage (optional)
      description: The timeframe the data covers, in the source's own terms, e.g. "1985–2024 (annual)" or "Updated monthly." Leave blank if there's no clear fixed range (e.g. a continuously-updated occurrence database).
      placeholder: "e.g. 1985–2024 (annual)"
    validations:
      required: false
  - type: input
    id: temporal_coverage_pt_br
    attributes:
      label: Período em português (opcional)
      description: Se você preencheu o período acima, traduza-o aqui. Deixe ambos os campos de tradução vazios se o período não se aplicar.
      placeholder: "ex.: 1985–2024 (anual)"
    validations:
      required: false
  - type: input
    id: temporal_coverage_es
    attributes:
      label: Periodo en español (opcional)
      description: Si completaste el período anterior, tradúcelo aquí. Deja ambos los campos de traducción vacíos si el período no aplica.
      placeholder: "p. ej., 1985–2024 (anual)"
    validations:
      required: false
  - type: input
    id: spatial_resolution
    attributes:
      label: Spatial resolution (optional)
      description: The spatial grain of the data, e.g. "30 m (Landsat-based classification)" or "Municipality level." Leave blank if a fixed resolution isn't a meaningful concept for this source.
      placeholder: "e.g. 30 m (Landsat-based classification)"
    validations:
      required: false
  - type: input
    id: spatial_resolution_pt_br
    attributes:
      label: Resolução espacial em português (opcional)
      description: Se você preencheu a resolução espacial acima, traduza-a aqui. Deixe ambos os campos de tradução vazios se a resolução não se aplicar.
      placeholder: "ex.: 30 m (classificação baseada em Landsat)"
    validations:
      required: false
  - type: input
    id: spatial_resolution_es
    attributes:
      label: Resolución espacial en español (opcional)
      description: Si completaste la resolución espacial anterior, tradúcela aquí. Deja ambos los campos de traducción vacíos si la resolución no se aplica.
      placeholder: "p. ej., 30 m (clasificación basada en Landsat)"
    validations:
      required: false
  - type: input
    id: methodology_url
    attributes:
      label: Methodology or documentation URL (optional)
      description: A direct link to the provider's methodology, technical note, or documentation — distinct from the publisher URL above. Must start with https:// or http://
      placeholder: "https://provider.org/methodology"
    validations:
      required: false
  - type: input
    id: license
    attributes:
      label: Named license (optional)
      description: Only fill this in when the provider explicitly names a specific open-data license (e.g. CC-BY-4.0, PDDL, ODbL). Leave blank if there's just a general terms note — that's what the access dropdown above is for.
      placeholder: "e.g. Open Data Commons Public Domain Dedication and License (PDDL)"
    validations:
      required: false
  - type: input
    id: license_pt_br
    attributes:
      label: Licença em português (opcional)
      description: Se você preencheu uma licença acima, informe aqui a forma em português. Mantenha o nome oficial inalterado quando ele for um título jurídico próprio.
      placeholder: "ex.: Licença CC BY 4.0"
    validations:
      required: false
  - type: input
    id: license_es
    attributes:
      label: Licencia en español (opcional)
      description: Si completaste una licencia anterior, indica aquí su forma en español. Conserva el nombre oficial si es un título jurídico propio.
      placeholder: "p. ej., Licencia CC BY 4.0"
    validations:
      required: false
  - type: checkboxes
    id: review_checks
    attributes:
      label: Review checks
      options:
        - label: I confirmed the URL belongs to the original publisher or their authorised repository.
          required: true
        - label: I am not submitting sensitive locations, personal data, or restricted community knowledge.
          required: true
        - label: I reviewed the source's access and reuse conditions and used a cautious access note.
          required: true
