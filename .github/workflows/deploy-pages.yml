name: Deploy GitHub Pages

on:
  # Writers call this workflow directly after a generated file reaches main.
  # Normal main pushes arrive through the quality gate below.
  workflow_call:
  workflow_run:
    workflows:
      - Quality gate
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    # A pull-request quality run must never publish. Direct reusable-workflow
    # callers have already written a generated file to main before invoking us.
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run repository quality gate
        run: npm run check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build curated public artifact
        run: npm run build:site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
