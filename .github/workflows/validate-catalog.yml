name: Validate catalog

on:
  pull_request:
    paths:
      - "data/catalog.js"
      - "data/catalog.schema.json"
      - "data/tag-presentation.js"
      - "scripts/validate-catalog.mjs"
      - "scripts/build-api.mjs"
  push:
    branches: [main]
    paths:
      - "data/catalog.js"
      - "data/catalog.schema.json"
      - "data/tag-presentation.js"
      - "scripts/validate-catalog.mjs"
      - "scripts/build-api.mjs"

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/validate-catalog.mjs


  publish-api:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.commit.outputs.changed }}
    permissions:
      contents: write
    concurrency:
      group: generated-main-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh the main checkout
        run: git pull --ff-only origin main
      - name: Regenerate public API mirror
        run: node scripts/build-api.mjs
      - name: Commit API mirror if changed
        id: commit
        run: |
          if git diff --quiet -- api/v1/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/v1/catalog.json
          git commit -m "Regenerate api/v1/catalog.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy-pages:
    if: github.event_name == 'push' && needs.publish-api.result == 'success' && needs.publish-api.outputs.api_changed == 'true'
    needs: publish-api
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
