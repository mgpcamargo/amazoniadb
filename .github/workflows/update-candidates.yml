name: Update candidates board

# Always checks out and updates main directly (not the pull_request merge
# ref) — this job's output reflects live GitHub API state, not any single
# PR's file changes, so there's nothing to review before it lands.

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, closed, edited, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 */6 * * *"  # safety net, every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      candidates_changed: ${{ steps.commit.outputs.changed }}
    concurrency:
      group: generated-main-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Refresh the main checkout
        run: git pull --ff-only origin main

      - name: Build candidates.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-candidates.mjs

      - name: Commit if changed
        id: commit
        # Fork PRs receive a read-only token by GitHub design. They can still
        # exercise the builder above, but only trusted repository events write
        # the generated board back to main.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates.js
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update candidates board [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy-pages:
    if: needs.build.result == 'success' && needs.build.outputs.candidates_changed == 'true'
    needs: build
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
