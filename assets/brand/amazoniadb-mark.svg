<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 192" role="img" aria-labelledby="title desc">
  <title id="title">AmazoniaDB network tree</title>
  <desc id="desc">A rooted tree built from eight precisely placed circular data nodes and their connecting branches.</desc>
  <!--
    The connection graph is deliberately sparse: every line terminates at a
    visible node, no paths cross, and the root is kept separate from the data
    nodes. This keeps the mark legible at favicon and header sizes.
  -->
  <g fill="none" stroke="#174A35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 171V102"/>
    <path d="M80 102L60 78 50 48 80 22"/>
    <path d="M80 102L100 78 110 48 80 22"/>
    <path d="M60 78L26 80"/>
    <path d="M100 78L134 80"/>
    <path d="M50 48L26 80"/>
    <path d="M110 48L134 80"/>
    <path d="M80 171C68 178 57 181 44 182"/>
    <path d="M80 171C92 178 103 181 116 182"/>
    <path d="M80 171V184"/>
  </g>
  <g fill="#ECF4D8" stroke="#174A35" stroke-width="5">
    <circle cx="80" cy="22" r="9"/>
    <circle cx="50" cy="48" r="9"/>
    <circle cx="110" cy="48" r="9"/>
    <circle cx="26" cy="80" r="9"/>
    <circle cx="60" cy="78" r="9"/>
    <circle cx="100" cy="78" r="9"/>
    <circle cx="134" cy="80" r="9"/>
  </g>
  <circle cx="80" cy="102" r="10" fill="#9BC36B" stroke="#174A35" stroke-width="5"/>
</svg>
