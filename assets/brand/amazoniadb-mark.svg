<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 192" role="img" aria-labelledby="title desc">
  <title id="title">AmazoniaDB castanheira mark</title>
  <desc id="desc">An asymmetrical Brazil-nut tree with six leaf-shaped data nodes, a seed pod, and buttress roots shaped like a river delta.</desc>
  <defs>
    <path id="leaf-node" d="M-12 0C-7-8 4-12 11-8C17-4 15 5 8 10C1 15-8 11-12 0Z"/>
  </defs>
  <!-- Six leaf nodes correspond to the six catalog domains. Each curved branch
       ends below a leaf centre; branches never cross or form stock network loops. -->
  <g fill="none" stroke="#174A35" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 120C75 89 74 55 72 38"/>
    <path d="M79 120C88 94 103 68 111 56"/>
    <path d="M77 121C62 104 43 87 31 81"/>
    <path d="M79 119C84 103 90 92 93 89"/>
    <path d="M80 120C99 113 120 107 137 110"/>
    <path d="M77 122C66 116 56 111 48 108"/>
  </g>
  <path d="M70 164C71 149 71 134 75 119C76 115 79 112 82 115C86 130 86 148 87 164C85 170 74 170 70 164Z" fill="#174A35"/>
  <g fill="none" stroke="#174A35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 160C65 173 53 178 38 180"/>
    <path d="M78 160C79 173 80 180 80 186"/>
    <path d="M79 160C93 172 108 177 124 178"/>
  </g>
  <path d="M78 105C85 108 88 115 84 122C81 128 72 128 68 122C64 115 69 108 78 105Z" fill="#B4C962" stroke="#174A35" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#E8F0C8" stroke="#174A35" stroke-width="4" stroke-linejoin="round">
    <g transform="translate(72 27) rotate(-8)"><use href="#leaf-node"/></g>
    <g transform="translate(111 45) rotate(28)"><use href="#leaf-node"/></g>
    <g transform="translate(31 70) rotate(-42)"><use href="#leaf-node"/></g>
    <g transform="translate(93 78) rotate(4)"><use href="#leaf-node"/></g>
    <g transform="translate(137 99) rotate(39)"><use href="#leaf-node"/></g>
    <g transform="translate(48 108) rotate(-24)"><use href="#leaf-node"/></g>
  </g>
  <g fill="none" stroke="#6C964D" stroke-width="2.5" stroke-linecap="round">
    <path d="M69 31L76 24"/>
    <path d="M107 49L115 42"/>
    <path d="M27 74L35 67"/>
    <path d="M90 82L96 76"/>
    <path d="M133 103L141 96"/>
    <path d="M44 112L52 105"/>
  </g>
</svg>
